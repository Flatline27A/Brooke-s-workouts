<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cut">
<meta name="theme-color" content="#2b1d2f">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>Strong at Home</title>
<style>
  :root{
    --bg:#faf6f2; --card:#ffffff; --ink:#2b1d2f; --muted:#7a6a78; --line:#eadfd8;
    --accent:#c0566f; --accent2:#e8a87c; --good:#3f8f6b; --soft:#f6e9e4; --core:#5b7fa6; --cardio:#d08a3e;
  }
  *{box-sizing:border-box}
  html,body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.4 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Helvetica,Arial,sans-serif;-webkit-text-size-adjust:100%}
  header{position:sticky;top:0;z-index:20;background:var(--ink);color:#fff;padding:calc(env(safe-area-inset-top) + 10px) 16px 10px}
  header .row{display:flex;align-items:center;justify-content:space-between;gap:8px}
  header h1{font-size:19px;margin:0;letter-spacing:.3px}
  header .who{font-size:13px;opacity:.85}
  header .who a{color:var(--accent2);text-decoration:none;margin-left:4px}
  #sync{font-size:12px;opacity:.8;margin-top:2px}
  #sync.err{color:#ffb4b4;opacity:1}
  nav.tabs{display:flex;gap:6px;margin-top:10px}
  nav.tabs button{flex:1;border:0;border-radius:10px;padding:8px 0;background:rgba(255,255,255,.12);color:#fff;font-weight:600;font-size:14px}
  nav.tabs button.on{background:var(--accent)}
  main{padding:14px 14px 120px;max-width:720px;margin:0 auto}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .muted{color:var(--muted)}
  .small{font-size:13px}
  .bar{height:10px;background:var(--soft);border-radius:6px;overflow:hidden;margin:8px 0 6px}
  .bar>div{height:100%;background:linear-gradient(90deg,var(--accent),var(--accent2))}
  .stats{display:flex;gap:10px}
  .stats div{flex:1;background:var(--soft);border-radius:10px;padding:8px 10px}
  .stats b{display:block;font-size:20px}
  .weeks{display:flex;gap:6px;overflow-x:auto;padding:2px 0 8px;scrollbar-width:none}
  .weeks::-webkit-scrollbar{display:none}
  .weeks button{flex:0 0 auto;min-width:46px;border:1px solid var(--line);background:#fff;border-radius:10px;padding:6px 8px;font-weight:700;color:var(--ink);position:relative}
  .weeks button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
  .weeks button.now::after{content:"";position:absolute;top:3px;right:3px;width:7px;height:7px;border-radius:50%;background:var(--accent)}
  .weeks button.full{border-color:var(--good)}
  .phase{border-left:4px solid var(--accent);padding-left:10px}
  .phase h3{margin:0 0 4px;font-size:16px}
  .day{display:flex;align-items:center;gap:12px;cursor:pointer}
  .day .badge{width:44px;height:44px;border-radius:12px;background:var(--soft);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:18px;color:var(--accent);flex:0 0 auto}
  .day.done .badge{background:var(--good);color:#fff}
  .day .info{flex:1;min-width:0}
  .day .info b{display:block}
  .chev{color:var(--muted);font-size:22px}
  .tag{display:inline-block;font-size:11px;font-weight:700;padding:2px 7px;border-radius:20px;background:var(--soft);color:var(--accent);margin-left:6px;vertical-align:middle}
  .btn{display:inline-block;border:0;border-radius:12px;padding:12px 16px;font-weight:700;font-size:15px;background:var(--accent);color:#fff;cursor:pointer}
  .btn.ghost{background:#fff;color:var(--ink);border:1px solid var(--line)}
  .btn.good{background:var(--good)}
  .btn.block{display:block;width:100%}
  .btn:disabled{opacity:.5}
  .back{background:none;border:0;color:var(--accent);font-weight:700;font-size:15px;padding:4px 0;margin-bottom:6px}
  .section{font-size:12px;font-weight:800;letter-spacing:1px;text-transform:uppercase;margin:18px 2px 8px}
  .section.core{color:var(--core)} .section.main{color:var(--accent)} .section.finish{color:var(--cardio)}
  .ex h4{margin:0;font-size:16px}
  .ex .rx{font-size:13px;color:var(--muted);margin-top:2px}
  .ex .last{font-size:13px;margin-top:6px;background:#f3f6fa;border-radius:8px;padding:6px 8px;color:#3d5573}
  .ex .last.none{background:transparent;padding:0;color:var(--muted)}
  .ex details{margin-top:6px}
  .ex summary{font-size:13px;color:var(--accent);font-weight:600;cursor:pointer}
  .ex details p{font-size:14px;margin:6px 0 0;color:#4a3c48}
  .sets{margin-top:10px;display:grid;gap:6px}
  .set{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:6px;align-items:center}
  .set.two{grid-template-columns:34px 1fr 44px}
  .set .n{font-size:13px;color:var(--muted);text-align:center;font-weight:700}
  .set input{width:100%;font-size:16px;padding:10px 8px;border:1px solid var(--line);border-radius:10px;background:#fff;color:var(--ink);text-align:center}
  .set input:focus{outline:2px solid var(--accent2);border-color:transparent}
  .set .chk{width:44px;height:42px;border-radius:10px;border:1px solid var(--line);background:#fff;font-size:18px;color:#bbb}
  .set .chk.on{background:var(--good);color:#fff;border-color:var(--good)}
  .colhead{display:grid;grid-template-columns:34px 1fr 1fr 44px;gap:6px;font-size:11px;color:var(--muted);text-align:center;font-weight:700;text-transform:uppercase}
  .colhead.two{grid-template-columns:34px 1fr 44px}
  .rest{margin-top:8px;font-size:13px;border:1px solid var(--line);background:#fff;border-radius:20px;padding:6px 12px;color:var(--ink)}
  textarea{width:100%;min-height:70px;font:inherit;font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px}
  #timer{position:fixed;left:12px;right:12px;bottom:calc(env(safe-area-inset-bottom) + 12px);z-index:30;background:var(--ink);color:#fff;border-radius:16px;padding:12px 16px;display:none;align-items:center;justify-content:space-between;box-shadow:0 6px 24px rgba(0,0,0,.25)}
  #timer b{font-size:26px;font-variant-numeric:tabular-nums}
  #timer button{background:rgba(255,255,255,.15);color:#fff;border:0;border-radius:10px;padding:8px 12px;font-weight:700;margin-left:6px}
  #timer.done{background:var(--good)}
  .note{background:var(--soft);border-radius:12px;padding:10px 12px;font-size:14px;margin-bottom:12px}
  .guide h3{margin:0 0 6px}
  .guide p,.guide li{font-size:15px}
  .guide ul{padding-left:20px;margin:6px 0}
  .picker{position:fixed;inset:0;background:rgba(43,29,47,.92);z-index:50;display:flex;align-items:center;justify-content:center;padding:20px}
  .picker .card{width:100%;max-width:380px}
  .picker input{width:100%;font-size:16px;padding:12px;border:1px solid var(--line);border-radius:10px;margin:8px 0}
  .userbtn{display:block;width:100%;margin-bottom:8px}
  label.lbl{display:block;font-size:13px;color:var(--muted);margin:10px 0 4px;font-weight:600}
  input[type=date]{font-size:16px;padding:10px;border:1px solid var(--line);border-radius:10px;width:100%;background:#fff}
  .retry{color:#fff;text-decoration:underline;background:none;border:0;font-size:12px;padding:0;margin-left:6px}
</style>
</head>
<body>
<header>
  <div class="row">
    <h1>Strong at Home</h1>
    <div class="who" id="who"></div>
  </div>
  <div id="sync">Starting</div>
  <nav class="tabs">
    <button data-tab="train" class="on">Workouts</button>
    <button data-tab="guide">Guide</button>
    <button data-tab="settings">Settings</button>
  </nav>
</header>
<main id="app"></main>
<div id="timer"><div><div class="small" id="timerLbl">Rest</div><b id="timerVal">0:00</b></div><div><button id="tPlus">+30s</button><button id="tStop">Done</button></div></div>

<script>
/* ===================== CONFIG ===================== */
const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbxvkAEDqVKr5jVRHshtMvOTX1Ey5aUEjrr9d4Kzd6oJlJXnGRAuV65RtNfyt-tzpjee/exec';
const AUTOSAVE_MS = 10000;
const JSONP_TIMEOUT_MS = 20000;

/* ===================== EXERCISE LIBRARY =====================
   type: wt = weight + reps, bw = reps only, time = seconds, cardio = minutes */
const EX = {
  breath:{n:"90/90 Breathing",t:"bw",c:"Lie on your back with feet on the bench or wall, knees and hips bent to 90 degrees. Breathe in through your nose and let your ribs widen. Breathe out slowly through pursed lips while you gently draw your belly button in and lift your pelvic floor, like stopping the flow of urine. That exhale squeeze is the move you will use on every hard rep in this program."},
  heelslide:{n:"Heel Slides",t:"bw",c:"On your back, knees bent. Exhale, draw in your deep core, and slowly slide one heel out until the leg is almost straight, then pull it back. Your low back stays quietly on the floor. Alternate legs."},
  deadbug:{n:"Dead Bug",t:"bw",c:"On your back, arms up, knees over hips. Exhale and slowly reach one arm overhead while the opposite leg straightens toward the floor. Keep your low back flat. If your belly bulges or forms a ridge down the middle, shorten the reach or keep the knee bent."},
  deadbug_wt:{n:"Weighted Dead Bug",t:"wt",c:"Same as the dead bug, holding a light dumbbell in both hands straight above your chest. Only the legs move. Exhale on every reach and keep the belly flat with no doming."},
  birddog:{n:"Bird Dog",t:"bw",c:"On hands and knees. Exhale and reach one arm forward and the opposite leg back until both are level with your body. Hold 2 seconds without your hips tipping, then switch."},
  pallof:{n:"Band Pallof Press",t:"bw",c:"Anchor a band to the rack at chest height and stand sideways to it. Hold the band at your chest, exhale, and press it straight out. Do not let the band twist you. Step farther away to make it harder."},
  sideplank_k:{n:"Side Plank on Knees",t:"time",c:"Lie on your side on your forearm with knees bent. Lift your hips so your body forms a straight line from knees to head. Breathe slowly the whole time."},
  sideplank:{n:"Side Plank",t:"time",c:"Forearm under shoulder, legs straight and stacked or staggered. Lift your hips into a straight line and hold. Drop to the knees if your form breaks."},
  inclineplank:{n:"Incline Plank on Bench",t:"time",c:"Forearms or hands on the bench, body in a straight line. Squeeze your glutes and exhale gently. The incline takes pressure off the midline so you can build up safely."},
  plank:{n:"Plank",t:"time",c:"Forearms on the floor, body straight from head to heels. Squeeze glutes and quads. If you see doming down your belly, go back to the incline plank."},
  bear:{n:"Bear Hold",t:"time",c:"On hands and knees, toes tucked. Exhale and lift your knees 1 inch off the floor. Hold with a flat back and slow breaths."},
  suitcase:{n:"Suitcase Carry",t:"wt",c:"Hold one heavy dumbbell at your side and walk tall without leaning toward it. Log the weight and the seconds you walked. Switch hands each round."},
  shouldertap:{n:"Plank Shoulder Taps",t:"bw",c:"High plank on your hands, feet a little wider than hips. Tap one shoulder with the opposite hand without letting your hips sway. Elevate hands on the bench if needed."},
  rainbow:{n:"Landmine Rainbows",t:"wt",c:"Stand facing the landmine holding the end of the bar at forehead height, arms straight. Slowly arc it down toward one hip then the other while your hips and ribs stay square. Start with just the bar."},
  hollowtuck:{n:"Hollow Body Tuck Hold",t:"time",c:"On your back, low back pressed down, knees pulled in over hips and shoulders slightly lifted. Exhale and hold. Stop if your belly domes."},

  hipthrust:{n:"Hip Thrust",t:"wt",c:"Upper back on the edge of the bench, feet flat and about hip width. Start with a dumbbell on your hips and move to the barbell with a pad once you pass about 40 lb. Exhale, tuck your chin, and drive through your heels until hips are level with knees. Squeeze your glutes hard for 1 second at the top. Ribs stay down; do not arch your low back."},
  bstance:{n:"B Stance Hip Thrust",t:"wt",c:"Hip thrust setup, but slide one foot forward so only its heel touches. The back leg does almost all the work. Log the bar or dumbbell weight and reps per side."},
  glutebridge:{n:"Single Leg Glute Bridge",t:"bw",c:"On your back, one foot planted, the other knee pulled toward your chest. Drive through the planted heel and lift your hips. Pause at the top."},
  gobletsquat:{n:"Goblet Squat",t:"wt",c:"Hold a dumbbell vertically against your chest. Feet slightly wider than hips, toes slightly out. Sit down between your heels, chest tall, then exhale and stand. Go as deep as you can with a neutral back."},
  backsquat:{n:"Barbell Back Squat",t:"wt",c:"Set the safety pins in the rack just below your bottom position. Bar on your upper back, brace with a big breath, sit down and back, then exhale as you drive up. Start with the empty bar and add 5 to 10 lb when all reps feel solid."},
  lmsquat:{n:"Landmine Squat",t:"wt",c:"Hold the end of the landmine bar at your chest with both hands. Lean into it slightly and squat. The angled bar keeps you upright, which is easy on the back."},
  dbrdl:{n:"Dumbbell Romanian Deadlift",t:"wt",c:"Dumbbells in front of your thighs, soft knees. Push your hips straight back and slide the weights down your legs until you feel a big hamstring stretch, about mid shin. Squeeze glutes to stand. Back stays flat the whole time."},
  bbrdl:{n:"Barbell Romanian Deadlift",t:"wt",c:"Take the bar from the rack at hip height. Same motion as the dumbbell version: hips back, bar close to the legs, flat back, squeeze glutes to stand. Start with the empty bar."},
  sumodl:{n:"Sumo Deadlift",t:"wt",c:"Wide stance, toes out, hands inside your knees. Brace, push the floor apart with your feet, and stand up with the bar close. Lock out by squeezing your glutes, not leaning back."},
  lmrdl:{n:"Landmine Romanian Deadlift",t:"wt",c:"Straddle the landmine bar facing the anchor or hold it at your side. Hinge at the hips with a flat back, then drive your hips forward to stand."},
  revlunge:{n:"Dumbbell Reverse Lunge",t:"wt",c:"Hold dumbbells at your sides. Step one foot back and lower until the back knee nearly touches the floor. Drive through the front heel to stand. Reps listed are per leg."},
  stepup:{n:"Dumbbell Step Up",t:"wt",c:"Place one foot on the bench. Lean slightly forward and drive through that heel to stand on the bench, then lower slowly. Do not push off the back foot. Reps per leg."},
  bss:{n:"Bulgarian Split Squat",t:"wt",c:"Back foot laces down on the bench, front foot about 2 feet ahead. Lower straight down with a slight forward lean for more glute. Hold dumbbells once bodyweight is easy. Reps per leg."},

  dbbench:{n:"Dumbbell Bench Press",t:"wt",c:"Lie on the bench, dumbbells over your chest. Lower to the sides of your chest with elbows about 45 degrees from your body, then exhale and press up."},
  inclinedb:{n:"Incline Dumbbell Press",t:"wt",c:"Set the bench to a low incline (flat is fine if it does not incline). Press the dumbbells up over your upper chest and lower with control."},
  lmpress:{n:"Landmine Press",t:"wt",c:"Stand in a split stance holding the end of the landmine bar at your shoulder. Exhale and press up and forward. Keep ribs down and do not lean back. Reps per arm."},
  dbohp:{n:"Seated Dumbbell Shoulder Press",t:"wt",c:"Sit upright on the bench with back support. Press the dumbbells overhead and lower to ear height. Exhale on each press."},
  latraise:{n:"Dumbbell Lateral Raise",t:"wt",c:"Light dumbbells at your sides. Raise them out to shoulder height with a slight bend in the elbows, then lower slowly."},
  dbrow:{n:"Single Arm Dumbbell Row",t:"wt",c:"One hand and knee on the bench, back flat. Pull the dumbbell toward your hip, squeeze your shoulder blade, and lower slowly. Reps per arm."},
  chestrow:{n:"Chest Supported Dumbbell Row",t:"wt",c:"Lie face down on the bench at an incline (or flat). Row both dumbbells up, squeezing your shoulder blades together. The bench supports your trunk, so your core does not take the load."},
  lmrow:{n:"Landmine Row",t:"wt",c:"Straddle the landmine bar near the loaded end, hinge forward with a flat back, and row the bar to your chest using a handle or your hands under the plates."},
  bandpulldown:{n:"Band Lat Pulldown",t:"bw",c:"Loop a band over the pull up bar. Kneel and pull the band down to your upper chest, driving elbows toward your ribs."},
  pullneg:{n:"Pull Up Negatives",t:"bw",c:"Step up so your chin is over the bar. Lower yourself as slowly as you can, aiming for 3 to 5 seconds. Step back up and repeat."},
  bandpullup:{n:"Band Assisted Pull Up",t:"bw",c:"Loop a band over the bar and put a knee or foot in it. Pull your chin over the bar and lower with control. Use a lighter band as you get stronger."},
  facepull:{n:"Band Face Pull",t:"bw",c:"Anchor a band at face height. Pull it toward your forehead with elbows high, spreading the band apart. Great for posture."},
  ezcurl:{n:"EZ Bar Curl",t:"wt",c:"Stand tall holding the curl bar. Curl up without swinging, lower slowly."},
  preacher:{n:"Preacher Curl",t:"wt",c:"Use the curl attachment on the bench with the EZ bar or a dumbbell. Lower all the way down slowly and curl up."},
  triext:{n:"Lying Dumbbell Triceps Extension",t:"wt",c:"Lie on the bench holding dumbbells straight up. Bend only at the elbows to lower them beside your head, then extend."},

  latwalk:{n:"Band Lateral Walk",t:"bw",c:"Band around your legs just above the knees or at the ankles. Quarter squat, step sideways keeping tension in the band. Reps are steps each way."},
  frogpump:{n:"Banded Frog Pumps",t:"bw",c:"On your back, soles of the feet together, knees out, band above the knees. Drive your hips up and squeeze hard. Fast, high rep glute burner."},
  kickback:{n:"Band Glute Kickback",t:"bw",c:"On hands and knees or standing at the rack with a band around the ankle. Kick the leg straight back, squeeze the glute at the top. Do not arch the low back. Reps per leg."},
  clam:{n:"Banded Side Lying Clam",t:"bw",c:"Lie on your side, knees bent, band above the knees. Keep feet together and open the top knee. Do not roll your hips back. Reps per side."},
  abduction:{n:"Banded Seated Hip Abduction",t:"bw",c:"Sit on the edge of the bench, band above the knees. Push your knees out against the band and pause. Lean forward slightly for more glute."},

  incwalk:{n:"Incline Treadmill Walk",t:"cardio",c:"Set the incline between 6 and 12 and walk at a pace where you can talk but would rather not. Do not hold the rails. Log minutes and add your incline and speed in the notes."},
  intervals:{n:"Treadmill Intervals",t:"cardio",c:"Warm up 3 minutes. Then alternate the work period at a fast walk on a steep incline or a jog with the easy period at a slow walk. Cool down 3 minutes. Log total minutes."}
};

/* ===================== PROGRAM =====================
   [exerciseId, sets, reps, restSeconds] grouped by section */
const PHASES = [
  { name:"Phase 1: Foundation", weeks:[1,2,3,4],
    goal:"Learn the moves, reconnect the deep core, and build the habit. Pick weights you could lift 2 or 3 more times than the reps listed.",
    days:{
      A:{title:"Glutes and Push",core:[["breath",1,"8 breaths",0],["heelslide",2,"8 each",30],["pallof",2,"10 each",30]],
         main:[["hipthrust",3,"10 to 12",90],["gobletsquat",3,"10 to 12",90],["dbbench",3,"10 to 12",75],["dbrdl",3,"10 to 12",75],["latwalk",2,"12 each way",45]],
         finish:[["incwalk",1,"15 min",0]]},
      B:{title:"Glutes and Pull",core:[["breath",1,"8 breaths",0],["deadbug",2,"6 each",30],["sideplank_k",2,"20 sec each",30]],
         main:[["bbrdl",3,"10",90],["revlunge",3,"8 each",75],["dbrow",3,"10 each",60],["bandpulldown",3,"12",60],["frogpump",2,"20",45]],
         finish:[["intervals",1,"8 rounds: 30 sec fast, 60 sec easy",0]]},
      C:{title:"Full Body and Landmine",core:[["breath",1,"8 breaths",0],["birddog",2,"6 each",30],["inclineplank",2,"20 sec",30]],
         main:[["lmsquat",3,"10 to 12",90],["stepup",3,"8 each",75],["lmpress",3,"10 each",60],["chestrow",3,"10 to 12",60],["glutebridge",2,"10 each",45],["facepull",2,"15",45]],
         finish:[["incwalk",1,"20 min",0]]},
      D:{title:"Bonus Glute Pump",optional:true,core:[["breath",1,"8 breaths",0],["deadbug",2,"6 each",30],["pallof",2,"10 each",30]],
         main:[["frogpump",3,"20",45],["kickback",3,"15 each",45],["clam",2,"15 each",30],["abduction",2,"20",30],["glutebridge",2,"12 each",45]],
         finish:[["incwalk",1,"25 min",0]]}
    }},
  { name:"Phase 2: Build", weeks:[5,6,7,8],
    goal:"Heavier weights and fewer reps. The barbell squat comes in, along with pull up negatives. From here on, add Day D if you can fit a fourth day.",
    days:{
      A:{title:"Glutes and Push",core:[["breath",1,"5 breaths",0],["deadbug",2,"8 each",30],["pallof",2,"12 each",30]],
         main:[["hipthrust",3,"8 to 10",120],["backsquat",3,"8 to 10",120],["inclinedb",3,"8 to 10",90],["bss",3,"8 each",90],["latwalk",2,"15 each way",45]],
         finish:[["incwalk",1,"20 min",0]]},
      B:{title:"Glutes and Pull",core:[["breath",1,"5 breaths",0],["sideplank",2,"20 sec each",30],["bear",2,"20 sec",30]],
         main:[["bbrdl",3,"8 to 10",120],["revlunge",3,"10 each",90],["lmrow",3,"10",75],["pullneg",3,"3 to 5",90],["ezcurl",2,"12",45],["frogpump",2,"25",45]],
         finish:[["intervals",1,"10 rounds: 30 sec fast, 60 sec easy",0]]},
      C:{title:"Full Body and Landmine",core:[["breath",1,"5 breaths",0],["plank",2,"30 sec",30],["suitcase",2,"30 sec each",45]],
         main:[["lmrdl",3,"10",90],["stepup",3,"10 each",75],["dbohp",3,"10",75],["dbrow",3,"10 each",60],["latraise",2,"15",45],["triext",2,"12",45]],
         finish:[["incwalk",1,"25 min",0]]},
      D:{title:"Bonus Glute Pump",optional:true,core:[["breath",1,"5 breaths",0],["deadbug",2,"8 each",30],["pallof",2,"12 each",30]],
         main:[["hipthrust",3,"15",60],["kickback",3,"15 each",45],["abduction",3,"20",30],["frogpump",2,"30",45],["clam",2,"20 each",30]],
         finish:[["incwalk",1,"25 min",0]]}
    }},
  { name:"Phase 3: Sculpt", weeks:[9,10,11,12],
    goal:"Strength focus on the big lifts with harder core work and tougher intervals. Push the first lift of each day: these are your heaviest sets of the program.",
    days:{
      A:{title:"Glutes and Push",core:[["breath",1,"5 breaths",0],["deadbug_wt",2,"8 each",30],["rainbow",2,"8 each",45]],
         main:[["hipthrust",3,"6 to 8",120],["backsquat",3,"6 to 8",150],["bss",3,"10 each",90],["dbbench",3,"8 to 10",90],["latwalk",2,"20 each way",45]],
         finish:[["intervals",1,"12 rounds: 30 sec fast, 60 sec easy",0]]},
      B:{title:"Glutes and Pull",core:[["breath",1,"5 breaths",0],["sideplank",2,"30 sec each",30],["shouldertap",2,"10 each",30]],
         main:[["sumodl",3,"6 to 8",150],["bstance",3,"10 each",90],["lmrow",3,"8 to 10",75],["bandpullup",3,"5 to 8",90],["preacher",2,"12",45]],
         finish:[["incwalk",1,"25 min",0]]},
      C:{title:"Full Body and Landmine",core:[["breath",1,"5 breaths",0],["hollowtuck",2,"20 sec",30],["suitcase",2,"40 sec each",45]],
         main:[["gobletsquat",3,"12",75],["revlunge",3,"10 each",75],["lmpress",3,"10 each",60],["chestrow",3,"10 to 12",60],["dbrdl",3,"12",75],["latraise",2,"15",45]],
         finish:[["intervals",1,"10 rounds: 40 sec fast, 60 sec easy",0]]},
      D:{title:"Bonus Glute Pump",optional:true,core:[["breath",1,"5 breaths",0],["deadbug_wt",2,"8 each",30],["pallof",2,"12 each",30]],
         main:[["hipthrust",3,"15 with 2 sec hold",60],["kickback",3,"15 each",45],["abduction",3,"25",30],["glutebridge",2,"15 each",45],["clam",2,"20 each",30]],
         finish:[["incwalk",1,"30 min",0]]}
    }}
];
const DAY_KEYS = ["A","B","C","D"];
const WEEKS = 12;

function phaseFor(week){ return PHASES.find(p=>p.weeks.includes(week)); }
function weekNote(week){
  const pw = ((week-1)%4)+1, ph = Math.ceil(week/4);
  if(pw===1) return "First week of the phase. Learn the new moves and find your working weights.";
  if(pw===2) return "Same plan as last week. Try to add 5 lb or 1 to 2 reps on each lift.";
  if(pw===3) return "Push week: one extra set on the first two lifts of each day.";
  if(ph<3) return "Lighter week: one less set on every lift and use about 80% of last week's weights. Recovery is when you get stronger.";
  return "Final week. Keep the extra sets and try to beat your best weights.";
}
function buildDay(week, dk){
  const ph = phaseFor(week), d = ph.days[dk], pw = ((week-1)%4)+1, phn = Math.ceil(week/4);
  const items = [];
  const push = (sec, list) => list.forEach(([id,sets,reps,rest],i)=>{
    let s = sets;
    if(sec==="main"){
      if(pw>=3 && i<2 && !(pw===4 && phn<3)) s = sets+1;
      if(pw===4 && phn<3) s = Math.max(2, sets-1);
    }
    let r = reps;
    if(sec==="finish" && EX[id].t==="cardio" && id==="incwalk") r = (parseInt(reps,10) + (pw===4&&phn<3?0:(pw-1)*2)) + " min";
    items.push({id, sec, sets:s, reps:r, rest});
  });
  push("core", d.core); push("main", d.main); push("finish", d.finish);
  return {title:d.title, optional:!!d.optional, items, phase:ph};
}

function cacheKey(){ return "sah_cache_"+USER; }
function pendKey(){ return "sah_pend_"+USER; }
function loadLocal(){

  try{ DIRTY = JSON.parse(localStorage.getItem(pendKey())||"{}"); }catch(e){ DIRTY = {}; }

}
function saveLocal(){
  try{ localStorage.setItem(cacheKey(), JSON.stringify(DATA)); localStorage.setItem(pendKey(), JSON.stringify(DIRTY)); }catch(e){}
}
function setVal(k, v){
  v = (v==null) ? "" : String(v);
  if((DATA[k]||"") === v) return;
  DATA[k] = v; DIRTY[k] = v; saveLocal(); setSync("Unsaved changes");
}
function today(){ const d=new Date(); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0")+"-"+String(d.getDate()).padStart(2,"0"); }
function fmtDate(iso){ if(!iso) return ""; const [y,m,d]=iso.split("-").map(Number); return new Date(y,m-1,d).toLocaleDateString(undefined,{month:"short",day:"numeric"}); }

/* keys */
const kSet = (w,d,id,s,f)=>`L:${w}:${d}:${id}:${s}:${f}`;
const kDone = (w,d)=>`D:${w}:${d}`;
const kTouch = (w,d)=>`T:${w}:${d}`;

/* ===================== BACKEND (JSONP) ===================== */
const BACKEND_READY = APPS_SCRIPT_URL && APPS_SCRIPT_URL.indexOf("PASTE_")!==0;
let jsonpN = 0;
function jsonp(params){
  return new Promise((resolve,reject)=>{
    const cb = "__sah_cb"+(++jsonpN)+"_"+Date.now();
    const qs = Object.entries(Object.assign({},params,{callback:cb,_:Date.now()})).map(([k,v])=>encodeURIComponent(k)+"="+encodeURIComponent(v)).join("&");
    const s = document.createElement("script");
    const t = setTimeout(()=>{ cleanup(); reject(new Error("timeout")); }, JSONP_TIMEOUT_MS);
    function cleanup(){ clearTimeout(t); delete window[cb]; s.remove(); }
    window[cb] = (res)=>{ cleanup(); res && res.ok===false ? reject(new Error(res.error||"error")) : resolve(res); };
    s.onerror = ()=>{ cleanup(); reject(new Error("network")); };
    s.src = APPS_SCRIPT_URL + (APPS_SCRIPT_URL.indexOf("?")>=0?"&":"?") + qs;
    document.body.appendChild(s);
  });
}
function setSync(msg, err){
  const el = document.getElementById("sync");
  el.className = err ? "err" : "";
  el.innerHTML = "";
  el.appendChild(document.createTextNode(msg));
  if(err){ const b=document.createElement("button"); b.className="retry"; b.textContent="Tap to retry"; b.onclick=()=>boot(); el.appendChild(b); }
}
async function fetchAll(){
  if(!BACKEND_READY){ setSync("Saving on this device only (no Sheet connected yet)"); return; }
  setSync("Syncing");
  const res = await jsonp({action:"get", user:USER});
  const server = res.data || {};
  DATA = Object.assign({}, server, DIRTY);
  saveLocal();
}
let flushing = false;
async function flush(){
  if(!BACKEND_READY || flushing || !USER) return;
  const keys = Object.keys(DIRTY);
  if(!keys.length) return;
  flushing = true;
  try{
    // chunk so the URL stays short
    let chunk = {}, size = 0;
    const send = async (c)=>{ await jsonp({action:"set", user:USER, data:JSON.stringify(c)}); Object.keys(c).forEach(k=>{ if(DIRTY[k]===c[k]) delete DIRTY[k]; }); saveLocal(); };
    for(const k of keys){
      const piece = encodeURIComponent(JSON.stringify({[k]:DIRTY[k]}));
      if(size + piece.length > 1400 && size>0){ await send(chunk); chunk={}; size=0; }
      chunk[k]=DIRTY[k]; size+=piece.length;
    }
    if(Object.keys(chunk).length) await send(chunk);
    setSync("All changes saved " + new Date().toLocaleTimeString([], {hour:"numeric",minute:"2-digit"}));
  }catch(e){
    setSync("Could not reach the Sheet. Changes are kept on this phone.", true);
  }finally{ flushing = false; }
}
function beaconFlush(){
  if(!BACKEND_READY || !USER || !Object.keys(DIRTY).length) return;
  try{ navigator.sendBeacon(APPS_SCRIPT_URL, JSON.stringify({action:"set", user:USER, data:DIRTY})); }catch(e){}
}
setInterval(flush, AUTOSAVE_MS);
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden"){ beaconFlush(); flush(); } });
window.addEventListener("pagehide", beaconFlush);

/* ===================== DERIVED ===================== */
function startDate(){ return DATA["cfg:start"] || ""; }
function currentWeek(){
  const s = startDate(); if(!s) return 1;
  const [y,m,d]=s.split("-").map(Number);
  const diff = Math.floor((new Date() - new Date(y,m-1,d)) / 86400000);
  return Math.min(WEEKS, Math.max(1, Math.floor(diff/7)+1));
}
function sessionVolume(w,dk){
  const day = buildDay(w,dk); let v = 0;
  day.items.forEach(it=>{ if(EX[it.id].t!=="wt") return;
    for(let s=1;s<=it.sets;s++){ const wt=parseFloat(DATA[kSet(w,dk,it.id,s,"w")]); const rp=parseFloat(DATA[kSet(w,dk,it.id,s,"r")]); if(wt>0&&rp>0) v+=wt*rp; } });
  return Math.round(v);
}
function totalVolume(){ let v=0; for(let w=1;w<=WEEKS;w++) DAY_KEYS.forEach(d=>v+=sessionVolume(w,d)); return v; }
function doneCount(){ let n=0; for(let w=1;w<=WEEKS;w++) ["A","B","C"].forEach(d=>{ if(DATA[kDone(w,d)]) n++; }); return n; }
function bonusCount(){ let n=0; for(let w=1;w<=WEEKS;w++) if(DATA[kDone(w,"D")]) n++; return n; }
function hasLog(w,dk,id){ for(let s=1;s<=6;s++){ if(DATA[kSet(w,dk,id,s,"w")]||DATA[kSet(w,dk,id,s,"r")]) return true; } return false; }
function lastTime(id, w, dk){
  // most recent earlier session in the program that logged this exercise
  const order = (ww,d)=>ww*10+DAY_KEYS.indexOf(d);
  const here = order(w,dk); let best=null;
  for(let ww=1;ww<=WEEKS;ww++) DAY_KEYS.forEach(d=>{
    const o=order(ww,d); if(o>=here) return;
    if(hasLog(ww,d,id) && (!best || o>best.o)) best={o,w:ww,d};
  });
  if(!best) return null;
  const parts=[];
  for(let s=1;s<=6;s++){
    const wt=DATA[kSet(best.w,best.d,id,s,"w")], rp=DATA[kSet(best.w,best.d,id,s,"r")];
    if(!wt && !rp) continue;
    parts.push(EX[id].t==="wt" ? `${wt||"?"} x ${rp||"?"}` : `${rp||wt}`);
  }
  const date = DATA[kDone(best.w,best.d)] || DATA[kTouch(best.w,best.d)] || "";
  return {text:parts.join(", "), where:`Week ${best.w} Day ${best.d}`, date};
}

    localStorage.setItem("sah_known", JSON.stringify(known));
    flush(); // send anything pending for the previous person
    USER = name; localStorage.setItem("sah_user", USER);
    wrap.remove(); view={tab:"train",week:null,day:null}; boot();
  };
  wrap.querySelectorAll("[data-u]").forEach(b=>b.onclick=()=>pick(b.dataset.u));
  wrap.querySelector("#go").onclick=()=>pick(wrap.querySelector("#newName").value);
  wrap.querySelector("#newName").onkeydown=(e)=>{ if(e.key==="Enter") pick(e.target.value); };
}

/* ===================== BOOT ===================== */
document.querySelectorAll("nav.tabs button").forEach(b=>b.onclick=()=>{ view.tab=b.dataset.tab; if(view.tab==="train") view.day=null; render(); window.scrollTo(0,0); });
async function boot(){
  if(!USER){ render(); return showPicker(); }
  loadLocal(); render();
  try{ await fetchAll(); if(BACKEND_READY) setSync(Object.keys(DIRTY).length?"Unsaved changes":"Synced with Sheet"); await flush(); }
  catch(e){ setSync("Could not reach the Sheet. Showing what is saved on this phone.", true); }
  // re-render, but never clobber an input someone is typing in
  const a = document.activeElement;
  if(!(a && (a.tagName==="INPUT"||a.tagName==="TEXTAREA"))) render();
}
boot();
</script>
</body>
